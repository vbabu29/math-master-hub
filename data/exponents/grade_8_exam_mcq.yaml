exp_q1:
  category: "Same Base"
  question: "Find $x$ if $2^{3x} = 4^{x+2}$"
  options:
    - "$2$"
    - "$3$"
    - "$4$"
    - "$5$"
  answer: 2

exp_q2:
  category: "Equivalent Powers"
  question: "Which of these is NOT equal to $3^{12}$?"
  options:
    - "$9^{6}$"
    - "$27^{4}$"
    - "$81^{3}$"
    - "$243^{2}$"
  answer: 3

exp_q3:
  category: "Negative Exponents"
  question: "Simplify $(5^{-2})^{-3} \\times 5^{-4}$"
  options:
    - "$5^{-2}$"
    - "$25$"
    - "$5^{10}$"
    - "$5^{-10}$"
  answer: 1

exp_q4:
  category: "Comparing Powers"
  question: "If $x = 2^{100}$ and $y = 4^{51}$, which statement is true?"
  options:
    - "$x > y$"
    - "$y > x$"
    - "$x = y$"
    - "Cannot be determined"
  answer: 1

exp_q5:
  category: "Remainders"
  question: "What is the remainder when $3^{100}$ is divided by $4$?"
  options:
    - "$0$"
    - "$1$"
    - "$2$"
    - "$3$"
  answer: 1
